name: Build Android APK

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-apk:
    name: Build APK with Gradle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Verify or initialize signing keystore
        run: |
          if [ ! -f app/sami-signing-key.p12 ] || ! keytool -list -keystore app/sami-signing-key.p12 -storepass samitrading -storetype PKCS12 >/dev/null 2>&1; then
            rm -f app/sami-signing-key.p12
            keytool -genkeypair -v \
              -keystore app/sami-signing-key.p12 \
              -storetype PKCS12 \
              -storepass samitrading \
              -keypass samitrading \
              -alias sami \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Sami Trading Challenge, OU=Mobile, O=Sami, L=Riyadh, ST=Riyadh, C=SA"
          fi

      - name: Build Debug & Release Universal Signed APK
        run: |
          ./gradlew clean --no-daemon
          ./gradlew assembleDebug --no-daemon --stacktrace
          ./gradlew assembleRelease --no-daemon --stacktrace
          mkdir -p release_apk
          cp app/build/outputs/apk/release/*.apk release_apk/Sami-TradingChallenge-v1.2.0.apk

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Sami-TradingChallenge-APK
          path: release_apk/Sami-TradingChallenge-v1.2.0.apk
          if-no-files-found: error
          retention-days: 30
